<h3>Medicines</h3>

<div class="d-flex justify-content-between mb-3">
  <div class="form-inline">
    <input type="text" class="form-control mr-2" placeholder="Search medicines" [(ngModel)]="searchTerm" (keyup.enter)="load()" />
    <button class="btn btn-success" (click)="load()">Search</button>
  </div>
  <button class="btn btn-primary" (click)="openAddForm()">+ New Medicine</button>
</div>

<div class="alert alert-info" *ngIf="loading">Loading...</div>
<div class="alert alert-danger" *ngIf="error">{{ error }}</div>
<div class="alert alert-success" *ngIf="message">{{ message }}</div>

<table class="table table-bordered bg-white" *ngIf="!loading">
  <thead class="thead-light">
    <tr><th>Code</th><th>Name</th><th>Unit Price</th><th>Reorder Level</th><th>Active</th><th></th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let m of medicines">
      <td>{{ m.medicineCode }}</td>
      <td>{{ m.medicineName }}</td>
      <td>&#8377;{{ m.unitPrice }}</td>
      <td>{{ m.reorderLevel }}</td>
      <td><span class="badge" [class.badge-success]="m.isActive" [class.badge-secondary]="!m.isActive">{{ m.isActive ? 'Active' : 'Disabled' }}</span></td>
      <td>
        <button class="btn btn-sm btn-outline-primary mr-1" (click)="openEditForm(m)">Edit</button>
        <button class="btn btn-sm btn-outline-danger" *ngIf="m.isActive" (click)="disable(m.medicineId)">Disable</button>
      </td>
    </tr>
    <tr *ngIf="medicines.length === 0"><td colspan="6" class="text-center text-muted">No medicines found.</td></tr>
  </tbody>
</table>

<div class="card mt-3" *ngIf="showForm">
  <div class="card-body">
    <h5>{{ isEditMode ? 'Edit Medicine' : 'New Medicine' }}</h5>
    <form (ngSubmit)="save()">
      <div class="form-row">
        <div class="form-group col-md-3">
          <label>Medicine Code (blank = auto)</label>
          <input class="form-control" [(ngModel)]="form.medicineCode" name="medicineCode" />
        </div>
        <div class="form-group col-md-5">
          <label>Medicine Name *</label>
          <input class="form-control" [(ngModel)]="form.medicineName" name="medicineName" required />
        </div>
        <div class="form-group col-md-4">
          <label>Category</label>
          <select class="form-control" [(ngModel)]="form.categoryId" name="categoryId">
            <option [ngValue]="null">Select</option>
            <option *ngFor="let c of categories" [ngValue]="c.categoryId">{{ c.categoryName }}</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-4">
          <label>Manufacturer</label>
          <select class="form-control" [(ngModel)]="form.manufacturerId" name="manufacturerId">
            <option [ngValue]="null">Select</option>
            <option *ngFor="let m of manufacturers" [ngValue]="m.manufacturerId">{{ m.manufacturerName }}</option>
          </select>
        </div>
        <div class="form-group col-md-4">
          <label>Unit Price *</label>
          <input type="number" step="0.01" class="form-control" [(ngModel)]="form.unitPrice" name="unitPrice" required />
        </div>
        <div class="form-group col-md-4">
          <label>Reorder Level *</label>
          <input type="number" class="form-control" [(ngModel)]="form.reorderLevel" name="reorderLevel" required />
        </div>
      </div>

      <button type="submit" class="btn btn-success mr-2">Save</button>
      <button type="button" class="btn btn-outline-secondary" (click)="showForm = false">Cancel</button>
    </form>
  </div>
</div>
