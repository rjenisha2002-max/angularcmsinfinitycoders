<h3>Welcome, Dr. {{ doctorName }}</h3>

<div class="alert alert-info" *ngIf="loading">Loading dashboard...</div>
<div class="alert alert-danger" *ngIf="error">{{ error }}</div>

<div class="row mt-3" *ngIf="!loading && !error">
  <div class="col-md-4 mb-3">
    <div class="card text-white bg-success">
      <div class="card-body">
        <h5 class="card-title">Today's Appointments</h5>
        <p class="card-text display-4">{{ stats.todayTotal ?? 0 }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-4 mb-3">
    <div class="card text-white bg-warning">
      <div class="card-body">
        <h5 class="card-title">Pending Today</h5>
        <p class="card-text display-4">{{ stats.todayPending ?? 0 }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-4 mb-3">
    <div class="card text-white bg-info">
      <div class="card-body">
        <h5 class="card-title">Consultations Done</h5>
        <p class="card-text display-4">{{ stats.consultationsDone ?? 0 }}</p>
      </div>
    </div>
  </div>
</div>

<div class="mt-3">
  <a routerLink="/doctor/appointments" class="btn btn-success mr-2">View Appointments</a>
  <a routerLink="/doctor/patient-search" class="btn btn-outline-success">Patient History &amp; Reports</a>
</div>
