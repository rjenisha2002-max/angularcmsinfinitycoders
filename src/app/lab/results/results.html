<h3>Enter Lab Result</h3>

<div class="alert alert-info" *ngIf="loading">Loading...</div>
<div class="alert alert-danger" *ngIf="error">{{ error }}</div>
<div class="alert alert-warning" *ngIf="alreadyEntered">Result for this test has already been entered.</div>
<div class="alert alert-success" *ngIf="successMessage">
  {{ successMessage }}
  <button class="btn btn-sm btn-outline-success ml-2" (click)="backToPending()">Back to Pending Tests</button>
</div>

<div class="card" *ngIf="!loading && model && !successMessage">
  <div class="card-body">
    <h5>{{ model.patientName }} <small class="text-muted">({{ model.mmrCode }}, {{ model.age }} / {{ model.gender }})</small></h5>
    <p class="text-muted">Test: <strong>{{ model.testName }}</strong> &middot; Normal Range: {{ model.normalRange }} &middot; Doctor: {{ model.doctorName }}</p>

    <form (ngSubmit)="submit()" *ngIf="!alreadyEntered">
      <div class="form-group">
        <label>Result Value *</label>
        <input class="form-control" [(ngModel)]="model.resultValue" name="resultValue" required />
      </div>
      <div class="form-group">
        <label>Observation</label>
        <textarea class="form-control" rows="2" [(ngModel)]="model.observation" name="observation"></textarea>
      </div>
      <div class="form-group">
        <label>Remarks</label>
        <textarea class="form-control" rows="2" [(ngModel)]="model.remarks" name="remarks"></textarea>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" [(ngModel)]="model.isAbnormal" name="isAbnormal" id="isAbnormal" />
        <label class="form-check-label" for="isAbnormal">Mark as abnormal</label>
      </div>
      <button type="submit" class="btn btn-success" [disabled]="saving">
        <span *ngIf="saving" class="spinner-border spinner-border-sm mr-1"></span>
        Save Result
      </button>
    </form>
  </div>
</div>
