<h3>Patients</h3>

<div class="d-flex justify-content-between mb-3">
  <div class="form-inline">
    <select class="form-control mr-2" [(ngModel)]="searchBy">
      <option value="MMR">MMR Code</option>
      <option value="Name">Name</option>
      <option value="Mobile">Mobile</option>
    </select>
    <input type="text" class="form-control mr-2" placeholder="Search text" [(ngModel)]="searchText" (keyup.enter)="search()" />
    <button class="btn btn-success mr-2" (click)="search()">Search</button>
    <button class="btn btn-outline-secondary" (click)="loadAll()">Clear</button>
  </div>
  <button class="btn btn-primary" (click)="openAddForm()">+ New Patient</button>
</div>

<div class="alert alert-info" *ngIf="loading">Loading...</div>
<div class="alert alert-danger" *ngIf="error">{{ error }}</div>
<div class="alert alert-success" *ngIf="message">{{ message }}</div>

<table class="table table-bordered bg-white" *ngIf="!loading">
  <thead class="thead-light">
    <tr><th>Code</th><th>Name</th><th>Gender</th><th>Age</th><th>Mobile</th><th>Blood Grp</th><th></th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of patients">
      <td>{{ p.patientCode }}</td>
      <td>{{ p.fullName }}</td>
      <td>{{ p.gender }}</td>
      <td>{{ p.age }}</td>
      <td>{{ p.mobileNumber }}</td>
      <td>{{ p.bloodGroup }}</td>
      <td><button class="btn btn-sm btn-outline-primary" (click)="openEditForm(p)">Edit</button></td>
    </tr>
    <tr *ngIf="patients.length === 0"><td colspan="7" class="text-center text-muted">No patients found.</td></tr>
  </tbody>
</table>

<div class="card mt-3" *ngIf="showForm">
  <div class="card-body">
    <h5>{{ isEditMode ? 'Edit Patient' : 'New Patient' }}</h5>
    <form (ngSubmit)="save()">
      <div class="form-row">
        <div class="form-group col-md-6">
          <label>Full Name *</label>
          <input class="form-control" [(ngModel)]="form.fullName" name="fullName" required />
        </div>
        <div class="form-group col-md-3">
          <label>Gender *</label>
          <select class="form-control" [(ngModel)]="form.gender" name="gender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group col-md-3">
          <label>DOB</label>
          <input type="date" class="form-control" [(ngModel)]="form.dob" name="dob" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-3">
          <label>Blood Group</label>
          <select class="form-control" [(ngModel)]="form.bloodGroup" name="bloodGroup">
            <option value="Unknown">Unknown</option>
            <option value="A+">A+</option><option value="A-">A-</option>
            <option value="B+">B+</option><option value="B-">B-</option>
            <option value="AB+">AB+</option><option value="AB-">AB-</option>
            <option value="O+">O+</option><option value="O-">O-</option>
          </select>
        </div>
        <div class="form-group col-md-3">
          <label>Mobile Number *</label>
          <input class="form-control" [(ngModel)]="form.mobileNumber" name="mobileNumber" required />
        </div>
        <div class="form-group col-md-3">
          <label>Email</label>
          <input type="email" class="form-control" [(ngModel)]="form.email" name="email" />
        </div>
        <div class="form-group col-md-3">
          <label>Emergency Contact</label>
          <input class="form-control" [(ngModel)]="form.emergencyContactNumber" name="emergencyContactNumber" />
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea class="form-control" rows="2" [(ngModel)]="form.address" name="address"></textarea>
      </div>

      <button type="submit" class="btn btn-success mr-2">Save</button>
      <button type="button" class="btn btn-outline-secondary" (click)="cancelForm()">Cancel</button>
    </form>
  </div>
</div>
